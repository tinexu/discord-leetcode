name: LeetDraw Discord Ping

# Posts a random LeetCode problem to a Discord channel on a schedule, via an
# incoming webhook. No bot, no server needed - runs entirely on GitHub's free
# Actions runners, so it keeps firing even if nothing else is online.
#
# Setup (one time):
#   1. Create (or reuse) any GitHub repo - it can be empty and private.
#   2. Add this file at: .github/workflows/leetcode-discord.yml
#   3. In the repo: Settings -> Secrets and variables -> Actions -> New repository secret
#        Name:  DISCORD_WEBHOOK_URL
#        Value: your Discord channel's webhook URL
#   4. Commit. That's it - it fires on the schedule below, and you can also
#      trigger it manually any time from the repo's Actions tab (this workflow's
#      page -> "Run workflow") to test it right away.
#
# No-repeat tracking needs the workflow to push a small state file
# (.github/leetdraw-seen.json) back to the repo after each run - that's what
# `permissions: contents: write` and the final "Persist" step below are for.
# This only works if pushes straight to the default branch are allowed (no
# required-review branch protection on it); a brand-new/personal repo is
# fine by default.

on:
  schedule:
    # Every 2 hours from 9:00 AM to 5:00 PM America/Indianapolis (Eastern)
    # inclusive - fires at 9am, 11am, 1pm, 3pm, 5pm (5 pings/day). Written in
    # UTC (13-21/2) for the current UTC-4 daylight-saving offset; shift both
    # numbers to 14-22/2 once DST ends (first Sunday in November) to keep it
    # pinned to 9-5 local.
    - cron: '0 13-21/2 * * *'
  workflow_dispatch: {}   # lets you fire it on demand from the Actions tab, to test

permissions:
  contents: write   # lets this workflow commit the no-repeat state file back to the repo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pick a random problem and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - << 'PYSCRIPT'
          import json
          import os
          import random
          import urllib.request

          STATE_PATH = ".github/leetdraw-seen.json"

          # (title, leetcode slug, difficulty) - same 160-problem set as the LeetDraw app
          PROBLEMS = [
              ('Two Sum', 'two-sum', 'E'),
              ('Contains Duplicate', 'contains-duplicate', 'E'),
              ('Valid Anagram', 'valid-anagram', 'E'),
              ('Valid Palindrome', 'valid-palindrome', 'E'),
              ('Best Time to Buy and Sell Stock', 'best-time-to-buy-and-sell-stock', 'E'),
              ('Valid Parentheses', 'valid-parentheses', 'E'),
              ('Binary Search', 'binary-search', 'E'),
              ('Reverse Linked List', 'reverse-linked-list', 'E'),
              ('Merge Two Sorted Lists', 'merge-two-sorted-lists', 'E'),
              ('Linked List Cycle', 'linked-list-cycle', 'E'),
              ('Invert Binary Tree', 'invert-binary-tree', 'E'),
              ('Maximum Depth of Binary Tree', 'maximum-depth-of-binary-tree', 'E'),
              ('Diameter of Binary Tree', 'diameter-of-binary-tree', 'E'),
              ('Balanced Binary Tree', 'balanced-binary-tree', 'E'),
              ('Same Tree', 'same-tree', 'E'),
              ('Subtree of Another Tree', 'subtree-of-another-tree', 'E'),
              ('Symmetric Tree', 'symmetric-tree', 'E'),
              ('Path Sum', 'path-sum', 'E'),
              ('Kth Largest Element in a Stream', 'kth-largest-element-in-a-stream', 'E'),
              ('Last Stone Weight', 'last-stone-weight', 'E'),
              ('Climbing Stairs', 'climbing-stairs', 'E'),
